site_name: Ouroboros 문서
site_url: https://ouroboros.page/docs/
docs_dir: content
site_dir: ../site/docs
strict: true
theme:
  name: material
  custom_dir: overrides
  language: ko
  font: false
  features:
    - navigation.sections
    - navigation.path
    - content.code.copy
    - search.suggest
    - search.highlight
plugins:
  - search:
      lang:
        - ko
        - en
        - zh
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
nav:
  - 문서 홈: index.md
  - 빠른 시작: quickstart.md
  - Interview: interview-guide.md
  - Seed: seed-guide.md
  - AI 문제 해결: ai-troubleshooting.md
  - 판본과 확인: version-guide.md
  - 상태와 ID: status-guide.md
  - 모델 라우팅 (592판): model-routing-guide.md
  - Megacode 사용 (592판): megacode-guide.md
  - 설정 GUI (592판): settings-gui-guide.md
  - 참조:
      - CLI 안내: cli-reference-guide.md
      - CLI 상세 (722판): cli-reference-detail.md
      - MCP 안내: mcp-reference-guide.md
      - MCP 상세 (722판): mcp-reference-detail.md
      - 설정 안내: config-reference-guide.md
      - 설정 상세 (722판): config-reference-detail.md
  - 주제별 상세 (722판):
